spring:
  config:
    import:
      - "nacos:arch-base.yaml?group=DEFAULT_GROUP&namespace=dev"
      - "nacos:stargaze-dataset.yaml?group=DEFAULT_GROUP&namespace=dev"
  cloud:
    nacos:
      server-addr: 10.0.0.2:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        namespace: dev
      discovery:
        ephemeral: true
        namespace: dev
  # 元数据库 PostgreSQL(观星元数据 + pgvector 向量)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://10.0.0.2:5432/stargaze?currentSchema=stargaze_dataset
    username: postgres
    password: postgres
  # MyBatis-Plus
  data:
    redis:
      host: 10.0.0.2
      port: 6379

# StarRocks 物化加速目标引擎(JDBC 兼容 MySQL 协议)
starrocks:
  url: jdbc:mysql://10.0.0.2:32132/?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: root
  password: 123456
  database: stargaze_materialized
  excel-table-prefix: excel_ds_
  insert-batch-size: 1000

# 数据源连接密码 AES-256-GCM 加密密钥(KMS 托管,私有化部署可环境变量覆盖)
dataset:
  crypto:
    aes-key: ${DATASET_CRYPTO_AES_KEY:stargaze-dataset-aes-key}
  # SQL 数据集执行配置(超时/行数上限)
  sql:
    query-timeout-seconds: 30
    max-sample-rows: 1000
    max-preview-rows: 500
  # Excel 文件解析配置(大小/行列/采样上限)
  excel:
    max-file-size: 52428800
    max-rows: 100000
    max-columns: 500
    sample-rows: 100
    infer-rows: 100

# S3 文件存储(Excel/CSV 上传,rustfs S3 兼容协议)
s3:
  endpoint: http://10.0.0.2:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: stargaze-dataset

# 元数据刷新调度(每日凌晨自动同步结构变更)
dataset-refresh:
  cron: "0 30 1 * * ?"
